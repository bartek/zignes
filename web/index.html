<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>zignes</title>
<style>
    html, body { margin: 0; background: #111; color: #eee; font: 14px monospace; }
    main { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; }
    canvas {
        width: 512px; height: 480px;          /* 2x scale via CSS */
        image-rendering: pixelated;            /* keep crisp pixels */
        background: #000;
        border: 1px solid #333;
    }
    #status { opacity: 0.7; }
    kbd { background: #222; border: 1px solid #444; border-radius: 3px; padding: 1px 5px; }
</style>
</head>
<body>
<main>
    <canvas id="screen" width="256" height="240"></canvas>
    <div id="status">loading…</div>
    <div>
        <kbd>Z</kbd> B &nbsp;
        <kbd>X</kbd> A &nbsp;
        <kbd>Enter</kbd> Start &nbsp;
        <kbd>RShift</kbd> Select &nbsp;
        <kbd>Arrows</kbd> D-pad
    </div>
</main>

<script type="module">
const WASM_URL = "/zig-out/wasm/zignes.wasm";
const ROM_URL = "/roms/donkeykong.nes";

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const image = ctx.createImageData(256, 240);
const status = document.getElementById("status");

const setStatus = (msg) => { status.textContent = msg; };

async function main() {
    setStatus("fetching wasm + rom…");
    const [wasmResp, romResp] = await Promise.all([
        fetch(WASM_URL),
        fetch(ROM_URL),
    ]);
    if (!wasmResp.ok) throw new Error(`wasm fetch: ${wasmResp.status}`);
    if (!romResp.ok) throw new Error(`rom fetch: ${romResp.status}`);

    const { instance } = await WebAssembly.instantiateStreaming(wasmResp, {});
    const { memory, alloc, init, tick_frame, set_buttons } = instance.exports;

    const romBytes = new Uint8Array(await romResp.arrayBuffer());
    const romPtr = alloc(romBytes.length);
    new Uint8Array(memory.buffer, romPtr, romBytes.length).set(romBytes);

    if (!init(romPtr, romBytes.length)) {
        setStatus("init failed: bad ROM?");
        return;
    }

    // Keyboard → controller bitmask (bit 0 = A, 1 = B, 2 = Select, 3 = Start,
    // 4 = Up, 5 = Down, 6 = Left, 7 = Right). Mirrors mapKey() in src/main.zig.
    const KEY_BITS = {
        KeyX: 0, KeyZ: 1, ShiftRight: 2, Enter: 3,
        ArrowUp: 4, ArrowDown: 5, ArrowLeft: 6, ArrowRight: 7,
    };
    let buttons = 0;
    const handleKey = (e, pressed) => {
        const bit = KEY_BITS[e.code];
        if (bit === undefined) return;
        e.preventDefault();
        buttons = pressed ? (buttons | (1 << bit)) : (buttons & ~(1 << bit));
        set_buttons(buttons);
    };
    addEventListener("keydown", (e) => handleKey(e, true));
    addEventListener("keyup",   (e) => handleKey(e, false));

    setStatus("running");

    let frames = 0, lastFpsT = performance.now();
    const FB_LEN = 256 * 240 * 4;

    const frame = () => {
        const fbPtr = tick_frame();
        // Re-create the view each frame: memory.buffer can be invalidated if WASM
        // grows its memory. Cheap (no copy until .set()).
        image.data.set(new Uint8Array(memory.buffer, fbPtr, FB_LEN));
        ctx.putImageData(image, 0, 0);

        frames++;
        const now = performance.now();
        if (now - lastFpsT >= 1000) {
            setStatus(`running · ${frames} fps`);
            frames = 0;
            lastFpsT = now;
        }
        requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
}

main().catch((e) => {
    console.error(e);
    setStatus(`error: ${e.message}`);
});
</script>
</body>
</html>
